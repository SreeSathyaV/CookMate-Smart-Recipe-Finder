<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Recipe Details - CookMate</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .recipe-detail-page {
            padding: 60px 8%;
            background: #fffdf5;
        }

        .breadcrumb {
            margin-bottom: 25px;
            color: #777;
            font-size: 14px;
        }

        .recipe-detail-header {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 45px;
        }

        .recipe-big-image {
            height: 280px;
            border-radius: 25px;
            background: #f5efe0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 110px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .recipe-category {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #eee7d0;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .recipe-detail-header h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .recipe-rating {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .recipe-description {
            color: #666;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .recipe-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .info-box {
            background: white;
            border: 1px solid #eee;
            padding: 12px 18px;
            border-radius: 12px;
        }

        .recipe-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 35px;
        }

        .detail-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .detail-box h2 {
            margin-bottom: 20px;
        }

        .ingredient-list,
        .equipment-list,
        .steps-list {
            padding-left: 20px;
        }

        .ingredient-list li,
        .equipment-list li {
            margin-bottom: 12px;
        }

        .steps-list {
            counter-reset: recipe-step;
            list-style: none;
            padding-left: 0;
        }

        .steps-list li {
            counter-increment: recipe-step;
            position: relative;
            padding: 15px 15px 15px 55px;
            margin-bottom: 12px;
            background: #faf8ef;
            border-radius: 12px;
            line-height: 1.6;
        }

        .steps-list li::before {
            content: counter(recipe-step);
            position: absolute;
            left: 15px;
            top: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .tips-box {
            background: #f5efe0;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 35px;
        }

        .tips-box h2 {
            margin-bottom: 12px;
        }

        .related-section {
            margin-top: 40px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .related-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .related-card .food-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .related-card h3 {
            margin-bottom: 10px;
        }

        .not-found {
            text-align: center;
            padding: 80px 20px;
        }

        @media (max-width: 800px) {
            .recipe-detail-header {
                grid-template-columns: 1fr;
            }

            .recipe-big-image {
                width: 100%;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .recipe-detail-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

===================================================== */

function getRecipeTranslation(recipe) {

    const language = getRecipeLanguage();

    if (recipe.translations[language]) {

    return recipe.translations.en;

/* =====================================================
   RELATED RECIPES
===================================================== */

function getRelatedRecipes(currentId, language) {

    const relatedIds =
        Object.keys(recipes)
            .filter(id => id !== currentId)
            .slice(0, 3);


    return relatedIds.map(id => {

        const item = recipes[id];

        const data =
            item.translations[language] ||
            item.translations.en;


        return `

            <div class="related-card">

                <div class="food-icon">

                    ${item.emoji}

                </div>

                <h3>

                    ${data.name}

                </h3>

                <p>

                    ${data.category}

                </p>

                <br>

                <a
                    href="recipe-details.html?recipe=${id}"
                    class="primary-btn"
                >

                    View Recipe

                </a>

            </div>

        `;

    }).join("");

}


/* =====================================================
   FAVOURITE
===================================================== */

function getFavourites() {

    return JSON.parse(
        localStorage.getItem("cookmateFavourites") || "[]"
    );

}


function toggleFavourite(id) {

    let favourites =
        getFavourites();


    const language =
        getRecipeLanguage();


    const savedText = {

        en: "Recipe saved!",
        ta: "சமையல் குறிப்பு சேமிக்கப்பட்டது!",
        hi: "रेसिपी सेव हो गई!",
        ml: "പാചകക്കുറിപ്പ് സേവ് ചെയ്തു!",
        te: "రెసిపీ సేవ్ చేయబడింది!"
    };


    const removedText = {

        en: "Recipe removed from favourites.",
        ta: "பிடித்தவைகளிலிருந்து நீக்கப்பட்டது.",
        hi: "रेसिपी पसंदीदा सूची से हटा दी गई।",
        ml: "പ്രിയപ്പെട്ടവയിൽ നിന്ന് നീക്കം ചെയ്തു.",
        te: "ఫేవరెట్స్ నుండి రెసిపీ తొలగించబడింది."
    };


    if (favourites.includes(id)) {

        favourites =
            favourites.filter(
                item => item !== id
            );


        alert(
            removedText[language] ||
            removedText.en
        );

    } else {

        favourites.push(id);

        alert(
            savedText[language] ||
            savedText.en
        );

    }


    localStorage.setItem(
        "cookmateFavourites",
        JSON.stringify(favourites)
    );


    renderRecipe();

}
